[project]
name = "pitchquery"
version = "0.1.0"
description = "A small search language for football match events, built on StatsBomb open data."
authors = [
    { name = "Lucas Costa", email = "lucasfreirecosta@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
]

[dependency-groups]
dev = [
    "hypothesis>=6.170.14",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["pitchquery", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
