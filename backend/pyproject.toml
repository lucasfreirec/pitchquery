[project]
name = "pitchquery"
version = "0.1.0"
description = "A small search language for football match events, built on StatsBomb open data."
authors = [
    { name = "Lucas Costa", email = "lucasfreirecosta@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.170.14",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["pitchquery", "tests", "benchmarks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    # Starlette's TestClient asks for an `httpx2` package; we stay on httpx until that
    # replacement is confirmed. Only this one warning is silenced.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff.lint.per-file-ignores]
# The error table is one case per line on purpose.
"tests/lang/test_parser.py" = ["E501"]
# Same for the completion position table.
"tests/lang/test_complete.py" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# ast._span() returns a dataclasses.field(); safe as a dataclass default (RUF009).
extend-immutable-calls = ["pitchquery.lang.ast._span"]
