# All hooks are local and run the tool versions pinned in uv.lock / package-lock.json,
# so pre-commit, `make lint` and CI always agree.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --directory backend ruff check --fix .
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: ruff-format
        name: ruff format
        entry: uv run --directory backend ruff format .
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: uv run --directory backend mypy
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: frontend-lint
        name: eslint + prettier
        entry: npm --prefix frontend run lint
        language: system
        files: ^frontend/
        pass_filenames: false
      - id: frontend-typecheck
        name: tsc
        entry: npm --prefix frontend run typecheck
        language: system
        files: ^frontend/.*\.tsx?$
        pass_filenames: false
